openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Menu categories with product counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      responses:
        "204": { description: Deleted empty category }
        "409": { description: Move products before deleting the category }
  /products:
    get:
      operationId: listProducts
      parameters:
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: featured, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Menu products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      responses:
        "204": { description: Deleted product }
  /auth/me:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Current administration access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
  /menu-summary:
    get:
      operationId: getMenuSummary
      responses:
        "200":
          description: Menu totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuSummary" }
  /settings:
    get:
      operationId: getStoreSettings
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
    patch:
      operationId: updateStoreSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }
components:
  schemas:
    CategoryInput:
      type: object
      required: [name, nameEn]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, maxLength: 80 }
    Category:
      type: object
      required: [id, name, nameEn, productCount]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: string }
        productCount: { type: integer }
    ProductInput:
      type: object
      required: [name, nameEn, description, price, categoryId, imageUrl, available, featured, badge]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        price: { type: number, minimum: 0, maximum: 100000 }
        categoryId: { type: integer, minimum: 1 }
        imageUrl: { type: string, maxLength: 2048 }
        available: { type: boolean }
        featured: { type: boolean }
        badge: { type: string, maxLength: 40 }
    Product:
      type: object
      required: [id, name, nameEn, description, price, categoryId, imageUrl, available, featured, badge]
      properties:
        id: { type: integer }
        name: { type: string }
        nameEn: { type: string }
        description: { type: string }
        price: { type: number }
        categoryId: { type: integer }
        imageUrl: { type: string }
        available: { type: boolean }
        featured: { type: boolean }
        badge: { type: string }
    AdminStatus:
      type: object
      required: [authenticated, isAdmin, configured]
      properties:
        authenticated: { type: boolean }
        isAdmin: { type: boolean }
        configured: { type: boolean }
    MenuSummary:
      type: object
      required: [totalProducts, availableProducts, totalCategories, featuredProducts]
      properties:
        totalProducts: { type: integer }
        availableProducts: { type: integer }
        totalCategories: { type: integer }
        featuredProducts: { type: integer }
    StoreSettings:
      type: object
      required: [currency]
      properties:
        currency: { type: string, minLength: 1, maxLength: 20 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

